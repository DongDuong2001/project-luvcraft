name: Supabase Database Keep-Alive

on:
  schedule:
    # Run at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allow manual triggers from the Actions tab

jobs:
  ping_db:
    name: Ping Database
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Postgres
        env:
          DB_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "Error: SUPABASE_DATABASE_URL secret is not set!"
            exit 1
          fi
          # Run a lightweight query to keep the database awake
          psql "$DB_URL" -c "SELECT 1;"
