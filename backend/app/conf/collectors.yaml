youtube:
  collector_class: "app.collectors.youtube:YouTubeCollector"
  task_name: "luvcraft.collect_youtube"
  name: "YouTube Data API"
  endpoints:
    - "https://www.googleapis.com/youtube/v3"
  enabled: true
  rate_limit_per_minute: 100
  source:
    name: "YouTube Data API"
    platform: "youtube"
    category: "video"
    access_method: "api"

community:
  collector_class: "app.collectors.community:CommunityCollector"
  task_name: "luvcraft.collect_community"
  name: "GitHub Community Collector"
  endpoints:
    - "https://api.github.com"
  enabled: true
  rate_limit_per_minute: 10
  source:
    name: "GitHub API"
    platform: "github"
    category: "community"
    access_method: "api"

hype:
  collector_class: "app.collectors.hype:HypeCollector"
  task_name: "luvcraft.collect_hype"
  name: "Hype Cycle Tracker"
  endpoints:
    - "https://www.youtube.com/results"
    - "https://www.twitch.tv/search"
  enabled: true
  rate_limit_per_minute: 30
  source:
    name: "Hype Sources"
    platform: "multi"
    category: "hype"
    access_method: "api"

social:
  collector_class: "app.collectors.social:SocialCollector"
  task_name: null
  name: "Social Volume Analytics"
  endpoints:
    - "https://api.stocktwits.com"
  enabled: false
  rate_limit_per_minute: 100
  source:
    name: "Public Social Signals"
    platform: "social"
    category: "social"
    access_method: "api"
