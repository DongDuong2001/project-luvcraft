youtube:
  collector_class: "app.collectors.youtube:YouTubeCollector"
  task_name: "luvcraft.collect_youtube"
  name: "YouTube Data API"
  endpoints:
    - "https://www.googleapis.com/youtube/v3"
  enabled: true
  rate_limit_per_minute: 100
  source:
    name: "YouTube Data API"
    platform: "youtube"
    category: "video"
    access_method: "api"

community:
  collector_class: "app.collectors.community:CommunityCollector"
  task_name: "luvcraft.collect_community"
  name: "GitHub Community Collector"
  endpoints:
    - "https://api.github.com"
  enabled: false
  rate_limit_per_minute: 10
  source:
    name: "GitHub API"
    platform: "github"
    category: "community"
    access_method: "api"

rss:
  collector_class: "app.collectors.rss:RSSCollector"
  task_name: "luvcraft.collect_rss"
  name: "Public News RSS"
  endpoints:
    # Search-feed templates may use {keyword}; static RSS/Atom URLs also work.
    # Add or replace feeds here without changing application code.
    - "https://news.google.com/rss/search?q={keyword}&hl=vi&gl=VN&ceid=VN:vi"
  enabled: true
  rate_limit_per_minute: 12
  source:
    name: "Public News RSS"
    platform: "rss"
    category: "publication"
    access_method: "rss"

hype:
  collector_class: "app.collectors.serpapi:SerpApiGoogleTrendsCollector"
  task_name: "luvcraft.collect_hype"
  name: "SerpApi Google Trends"
  endpoints:
    - "https://serpapi.com"
  enabled: true
  rate_limit_per_minute: 12
  source:
    name: "SerpApi Google Trends"
    platform: "serpapi_trends"
    category: "search_trend"
    access_method: "api"

social:
  collector_class: "app.collectors.serpapi:SerpApiSocialSearchCollector"
  task_name: "luvcraft.collect_social"
  name: "SerpApi Public Social Search"
  endpoints:
    - "https://serpapi.com"
  enabled: true
  rate_limit_per_minute: 12
  source:
    name: "SerpApi Public Social Search"
    platform: "serpapi_social"
    category: "public_social"
    access_method: "api"
